<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 60px}
.hero{background:linear-gradient(120deg,#5b21b6,#c026d3 55%,#f97316);color:#fff;border-radius:0 0 26px 26px;padding:26px 20px 70px;margin:0 -16px}
.hero h1{margin:0;font-size:26px}.hero p{margin:4px 0 0;opacity:.92}
.tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stats{display:flex;gap:10px;margin:-48px 0 14px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.stat b{font-size:22px;display:block;color:var(--acc)}.stat span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.small{padding:3px 10px;font-size:12px}
.hero button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:5px 13px;border-radius:99px;background:var(--acc2);color:var(--acc);border:0}
.chip.on{background:var(--acc);color:#fff}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-right:4px;background:var(--acc2);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mc{position:relative;overflow:hidden;text-align:left;padding:0;border-radius:18px;display:block;width:100%;background:var(--card);box-shadow:var(--sh);transition:transform .15s}
.mc:hover{transform:translateY(-3px)}
.mc .top{height:86px;display:flex;align-items:flex-end;padding:12px 16px;font-size:34px;color:#fff}
.mc .bd{padding:14px 16px 16px}
.mt{font-size:17px;font-weight:700;margin:6px 0 4px}
.path{color:var(--mut);font-size:13px}
.grp{font-size:13px;font-weight:800;color:var(--mut);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.07em}
.en{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac,#6d28d9);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.en h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center;justify-content:space-between}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.bub{background:var(--okbg);border-radius:4px 16px 16px 16px;padding:12px 14px;margin-top:6px}
.k-Do{background:var(--okbg)}.k-Dont{background:var(--badbg)}.k-Perubahan{background:var(--warnbg)}
.en.k-Do,.en.k-Dont,.en.k-Perubahan{background:var(--card)}
.en.k-Do{border-left-color:var(--ok)}.en.k-Dont{border-left-color:var(--bad)}.en.k-Perubahan{border-left-color:#f59e0b}
details.en summary{cursor:pointer;font-weight:600;list-style:none}
details.en summary::before{content:"+ ";color:var(--ac)}
details.en[open] summary::before{content:"\2212 "}
details.en pre{margin-top:8px}
.note{background:var(--warnbg);color:var(--warn);padding:9px 12px;border-radius:10px;margin-top:8px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:620px){.row{grid-template-columns:1fr}}
dialog{border:0;border-radius:18px;padding:18px;width:min(560px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 3px}
.res{margin-top:10px;font-weight:700;color:var(--acc)}
.foot{color:var(--mut);font-size:12.5px;margin-top:20px}
</style>
</head>

elpon 5000 menit Onnet & 50 menit Offnet (berlaku 30 hari), serta benefit tambahan Adobe Express, Anti Spam/Scam (90 hari), dan Vidio Lite + VIU/WeTV/iQIYI."}, {"m": "rea", "k": "Detail", "t": "Pemisahan transaksi dan bukti pembayaran", "b": "Jika ada transaksi lain, proses reaktivasi dan bukti pembayaran transaksi lainnya harus dipisahkan agar tidak tercampur dengan pengajuan reaktivasi nomor."}, {"m": "rea", "k": "Script", "t": "Standard jawaban Agent 3Store sebelum memproses reaktivasi", "b": "\"Nomor 3 Prabayar Bapak/Ibu dapat direaktivasi dengan total pembayaran Rp50.000. Harga tersebut sudah termasuk kuota data 10 GB dengan masa aktif 30 hari. Apakah proses reaktivasi dapat kami lanjutkan?\"", "n": "Agent wajib menyampaikan harga dan benefit secara jelas serta memperoleh persetujuan pelanggan sebelum transaksi diproses."}, {"m": "rea", "k": "Do", "t": "Yang harus dilakukan", "b": "1. Pastikan pelanggan memenuhi seluruh persyaratan pengajuan reaktivasi.\n2. Pastikan pelanggan lolos validasi.\n3. Sampaikan ketentuan starterpack beserta benefit yang diterima.\n4. Sampaikan total biaya Rp50.000.\n5. Lakukan reaktivasi mengikuti proses yang berlaku.\n6. Pastikan reaktivasi berhasil serta layanan dan benefit diterima pelanggan.\n7. Catat interaksi untuk permintaan reaktivasi yang diterima."}, {"m": "rea", "k": "Dont", "t": "Yang tidak perlu dilakukan", "b": "1. Jangan reaktivasi jika pelanggan tidak memenuhi syarat dan validasi.\n2. Jangan proses sebelum pelanggan memahami dan menyetujui biaya.\n3. Jangan menutup layanan sebelum reaktivasi berhasil dan benefit diterima pelanggan.\n4. Jangan tidak mencatat interaksi untuk permintaan reaktivasi yang diterima."}, {"m": "rea", "k": "FAQ", "t": "Berapa biaya yang diinformasikan untuk reaktivasi nomor prabayar?", "b": "Rp50.000 sesuai ketentuan harga starterpack yang berlaku."}, {"m": "rea", "k": "FAQ", "t": "Apa saja benefit yang didapat pelanggan dari reaktivasi?", "b": "Kuota 10 GB, ekstra nelpon 5000 menit Onnet & 50 menit Offnet (30 hari), Adobe Express, Anti Spam/Scam (90 hari), dan Vidio Lite + VIU/WeTV/iQIYI."}, {"m": "rea", "k": "FAQ", "t": "Boleh menawarkan paket data add-on kepada pelanggan yang reaktivasi?", "b": "Boleh, selama disepakati kedua belah pihak. Transaksi add-on harus diproses terpisah dari pengajuan reaktivasi, termasuk bukti pembayarannya."}, {"m": "rea", "k": "FAQ", "t": "Apakah reaktivasi dapat digabung dengan transaksi lain?", "b": "Tidak. Proses dan bukti pembayaran masing-masing transaksi harus terpisah."}, {"m": "rea", "k": "FAQ", "t": "Apakah starterpack 10GB 30 hari boleh ditawarkan ke pelanggan baru?", "b": "Tidak. Hanya untuk pelanggan yang mengajukan reaktivasi nomor Tri."}, {"m": "rea", "k": "FAQ", "t": "Apakah starterpack reaktivasi menerapkan auto-renewal?", "b": "Ya, auto-renewal berlaku untuk benefit kuota pada starterpack tersebut selama pulsa pelanggan mencukupi."}, {"m": "rea", "k": "FAQ", "t": "Permintaan reaktivasi diterima sebelum 21 Okt 2026: pakai ketentuan lama atau baru?", "b": "- Diterima sebelum 21 Okt 2026 dan proses belum selesai pada 21 Okt 2026: pakai ketentuan lama (Happy 7GB 28 hari Rp42.000 + kuota data 7GB 28 hari Rp40.000, total Rp82.000).\n- Diterima pada 21 Okt 2026: wajib ketentuan baru (starterpack 10GB 30 hari, total Rp50.000)."}, {"m": "mas", "k": "Detail", "t": "Mekanisme penambahan masa aktif", "b": "Pembelian pulsa sesuai denominasi yang berlaku menambah masa aktif kartu sesuai validity denom. Total masa aktif maksimal 365 hari. Jika sisa masa aktif kurang dari validity denom, penambahan hanya sampai batas 365 hari.\nContoh: masa aktif 360 hari, beli pulsa validity 100 hari, masa aktif hanya bertambah 5 hari menjadi 365 hari."}, {"m": "mas", "k": "Detail", "t": "Tabel denom pulsa dan validity (hari)", "b": "5.000, 8.000, 10.000, 12.000, 15.000, 20.000, 25.000, 30.000 = 30 hari\n35.000 = 35 | 40.000 = 40 | 45.000 = 45 | 50.000 = 50 | 55.000 = 55 | 60.000 = 60\n65.000 = 65 | 70.000 = 70 | 75.000 = 75 | 80.000 = 80 | 85.000 = 85 | 90.000 = 90 | 100.000 = 100\n105.000 = 105 | 125.000 = 125 | 150.000 = 150 | 200.000 = 200 | 250.000 = 250 | 300.000 = 300\n500.000 = 365"}, {"m": "mas", "k": "Detail", "t": "Matrix penambahan masa aktif", "b": "1. Masa aktif sudah 365 hari: tidak bertambah (sudah batas maksimal).\n2. Masa aktif 30 hari, beli validity 100 hari: bertambah 100 hari, dihitung dari tanggal transaksi reload.\n3. Masa aktif 360 hari, beli validity 100 hari: bertambah 5 hari sampai batas 365 hari."}, {"m": "mas", "k": "Penanganan", "t": "Kasus: Masa aktif tidak bertambah padahal sudah beli pulsa", "b": "Probing:\na. Nama Pelanggan\nb. MSISDN Pelanggan\nc. Kendala yang dikeluhkan\n\nHasil pengecekan: masa aktif kartu sudah mencapai batas maksimal 365 hari.\nPenanganan: edukasi bahwa masa aktif memiliki batas maksimal 365 hari; jika sudah 365 hari, pembelian pulsa tidak menambah masa aktif."}, {"m": "mas", "k": "Script", "t": "Standard jawaban: masa aktif sudah 365 hari", "b": "Bapak/Ibu/Kak [Nama Pelanggan], mohon maaf atas ketidaknyamanannya. Terkait masa aktif kartu, penambahan masa aktif dari pembelian pulsa mengikuti validity denom pulsa yang dibeli, dengan batas maksimal masa aktif kartu hingga 365 hari. Karena masa aktif kartu Bapak/Ibu/Kak sudah mencapai batas maksimal tersebut, maka pembelian pulsa tidak menambah masa aktif kartu. Terima kasih atas pengertiannya."}, {"m": "mas", "k": "Penanganan", "t": "Kasus: Masa aktif tinggal 5 hari, beli pulsa Rp100.000 (validity 100 hari), apakah bertambah 100 hari?", "b": "Hasil pengecekan: masa aktif belum mencapai 365 hari dan validity denom 100 hari.\nPenanganan: edukasi bahwa masa aktif bertambah sesuai validity denom selama total tidak melebihi 365 hari."}, {"m": "mas", "k": "Script", "t": "Standard jawaban: masa aktif belum mencapai 365 hari", "b": "Bapak/Ibu/Kak [Nama Pelanggan], kami informasikan bahwa masa aktif kartu akan bertambah sesuai validity dari denom pulsa yang dibeli. Jika masa aktif saat ini tersisa 5 hari dan Bapak/Ibu/Kak melakukan pembelian pulsa dengan validity 100 hari, maka masa aktif kartu akan bertambah 100 hari dari masa aktif yang tersedia saat transaksi dilakukan."}, {"m": "mas", "k": "Penanganan", "t": "Kasus: Masa aktif 360 hari, beli pulsa Rp100.000, apakah jadi 460 hari?", "b": "Hasil pengecekan: masa aktif 360 hari, validity 100 hari, batas maksimal 365 hari.\nPenanganan: edukasi bahwa penambahan mengikuti validity denom namun dibatasi maksimal 365 hari."}, {"m": "mas", "k": "Script", "t": "Standard jawaban: masa aktif mendekati 365 hari", "b": "Bapak/Ibu/Kak [Nama Pelanggan], mohon diinformasikan bahwa masa aktif kartu memiliki batas maksimal 365 hari. Jika masa aktif saat ini sudah 360 hari dan Bapak/Ibu/Kak membeli pulsa dengan validity 100 hari, maka masa aktif kartu hanya akan bertambah 5 hari hingga mencapai batas maksimal 365 hari. Terima kasih atas pengertiannya."}, {"m": "mas", "k": "FAQ", "t": "Apakah pembelian pulsa dapat menambah masa aktif kartu?", "b": "Ya, sesuai validity denom pulsa yang dibeli, dengan batas maksimal 365 hari."}, {"m": "mas", "k": "FAQ", "t": "Jika masa aktif sudah 365 hari, apakah pembelian pulsa menambah masa aktif?", "b": "Tidak. Masa aktif tetap mengikuti batas maksimal 365 hari."}, {"m": "mas", "k": "FAQ", "t": "Jika belum 365 hari, berapa lama masa aktif bertambah setelah beli pulsa?", "b": "Sesuai validity denom pulsa yang dibeli, selama total masa aktif tidak melebihi 365 hari."}, {"m": "mas", "k": "FAQ", "t": "Bagaimana jika validity pulsa lebih besar dari sisa masa aktif menuju 365 hari?", "b": "Penambahan hanya sampai batas maksimal 365 hari. Contoh: masa aktif 360 hari + validity 100 hari = bertambah 5 hari."}, {"m": "mas", "k": "Pencatatan", "t": "Pencatatan interaksi masa aktif", "b": "Gunakan activity code 2105260001 Check Active Period (inquiry)."}, {"m": "unr", "k": "Detail", "t": "Latar belakang dan identifikasi di Siebel", "b": "Keluhan: nomor IM3/Tri Prabayar tidak bisa dipakai (telpon, SMS, internet, dan layanan lain) karena status Not registered / Unpaired eKTP (nomor tidak teregistrasi).\nLakukan identifikasi sebelum memberi solusi:\n1. Status nomor Not registered / Unpaired eKTP (menu Assets, kolom Registration Status).\n2. Offer ID 4443."}, {"m": "unr", "k": "Detail", "t": "Cara cek Offer ID 4443 di Siebel", "b": "A. Melalui menu Asset:\n1. Klik menu Asset.\n2. Masuk ke menu Prepaid, scroll ke bawah.\n3. Klik Offer Information, lihat Offer ID (4443).\n\nB. Melalui menu Other Prepaid Functions:\n1. Klik Other Prepaid Functions.\n2. Klik Manual Offer Info.\n3. Input MSISDN pada Service Number, lihat Offer ID (4443)."}, {"m": "unr", "k": "Penanganan", "t": "Alur penanganan di Customer Service", "b": "1. Probing:\na. Nama Pelanggan\nb. Nomor Tri yang mengalami kendala\nc. Waktu nomor Tri tidak bisa digunakan\nd. Isi notifikasi yang diterima\n\n2. Cek aplikasi CRM dan pastikan status nomor Not registered / Unpaired eKTP dan Offer ID 4443.\n\n3. Berikan solusi sesuai status nomor (lihat penanganan di bawah)."}, {"m": "unr", "k": "Penanganan", "t": "Status Unregistered (Offer ID 4443)", "b": "- Pastikan status nomor masih aktif (tidak dalam masa tenggang / inactive).\n- Sarankan pelanggan melakukan registrasi prabayar melalui registrasi.ioh.co.id.\n- Edukasi langkah registrasi prabayar melalui website (jika diperlukan)."}, {"m": "unr", "k": "Penanganan", "t": "Status nomor sudah registered", "b": "Penanganan mengacu prosedur yang berlaku (existing process).\n- Dapat ditangani langsung (FCR): interaksi closed, tidak eskalasi ke Tier2.\n- Tidak dapat ditangani langsung / butuh penanganan lebih lanjut (Non FCR): eskalasi ke Tier2 sesuai ketentuan."}, {"m": "unr", "k": "Penanganan", "t": "Butuh penanganan khusus (potensi viral, ancam blow up media/social media/CEO/YLKI)", "b": "Jika pelanggan sudah diberi standar informasi oleh Tier1 namun tidak berkenan / butuh penanganan khusus, eskalasi ke Tier2 melalui trouble ticket. Cantumkan lengkap: keluhan pelanggan, hasil pengecekan, informasi yang sudah disampaikan, alasan eskalasi, dan informasi lainnya.\n\nCatatan penting:\n- Tim Tier2 dapat menghubungi pelanggan untuk edukasi dan penjelasan lebih lanjut.\n- Jika pelanggan tidak dapat diedukasi / tidak menerima penjelasan Tier2 dan butuh penanganan khusus (potensi viral, ancam blow up media/social media/CEO/YLKI, dll), case dapat dieskalasikan ke Tim Special Service sesuai ketentuan.\n- Penanganan mengacu prosedur Special Case yang berlaku."}, {"m": "unr", "k": "Script", "t": "Standard jawaban: nomor belum teregistrasi", "b": "Bapak/Ibu/Kak [Nama Pelanggan], mohon maaf atas ketidaknyamanannya.\nBerdasarkan hasil pengecekan nomor Bapak/Ibu/Kakak belum teregistrasi.\nUntuk kembali menggunakan layanan Tri, silakan melakukan registrasi Prabayar melalui registrasi.ioh.co.id.\nSetelah registrasi berhasil, pelanggan dapat kembali menggunakan layanan Tri sesuai status nomor dan benefit yang dimiliki.\nTerima kasih telah menggunakan layanan Tri."}, {"m": "unr", "k": "Pencatatan", "t": "Pencatatan interaksi Not Registered 4443", "b": "Wajib dicatat di CRM. Input hashtag di awal kalimat pada field Tier1 Agent Comment (Aplikasi SF).\n\n1. Activity code 2105170001 - Prepaid reg/unreg info\nDipakai jika pelanggan menanyakan edukasi registrasi prabayar, termasuk pelanggan berstatus UNREG yang perlu registrasi kembali.\nHashtag: #UNREG_4443\n\n2. Activity code 2405180001 - Prepaid reg/unreg issue\nDipakai untuk eskalasi saat pelanggan sudah diberi standar informasi namun tidak berkenan dan butuh eskalasi ke Tier2.\nHashtag: #UNREG_4443"}, {"m": "unr", "k": "Detail", "t": "Tahapan registrasi mandiri via website (validasi biometrik)", "b": "1. Akses https://registrasi.ioh.co.id, pilih Registrasi IM3 & Tri Prabayar.\n2. Input MSISDN.\n3. Validasi nomor: SMS OTP (dari INDOSAT OTP) atau 4 digit terakhir ICCID, lalu klik Lanjut.\n4. Input NIK, setelah validasi data berhasil klik Lanjut.\n5. Ambil foto selfie sesuai pemilik NIK, pastikan izin akses kamera aktif.\n6. Pastikan pengambilan foto sesuai ketentuan.\n7. Setelah validasi face recognition berhasil, permintaan diproses.\n8. Tunggu notifikasi registrasi berhasil."}, {"m": "unr", "k": "FAQ", "t": "Mengapa nomor saya tidak bisa digunakan untuk akses data?", "b": "Bapak/Ibu/Kak [Nama Pelanggan], mohon maaf atas ketidaknyamanannya.\nBerdasarkan hasil pengecekan status nomor Bapak/Ibu/Kakak saat ini belum teregistrasi.\nUntuk kembali menggunakan layanan Tri, silakan melakukan registrasi Prabayar melalui https://registrasi.ioh.co.id/\nSetelah registrasi berhasil, pelanggan dapat kembali menggunakan layanan Tri sesuai status nomor dan benefit yang dimiliki.\nTerima kasih telah menggunakan layanan IM3 / Tri (sesuai brand)."}, {"m": "unr", "k": "FAQ", "t": "Bagaimana cara registrasi prabayar?", "b": "Akses https://registrasi.ioh.co.id/\n1. Pilih menu Registrasi IM3 & Tri Prabayar.\n2. Input MSISDN yang akan diregistrasi.\n3. Validasi nomor dengan SMS OTP atau 4 digit terakhir ICCID.\n4. Input NIK sesuai identitas.\n5. Ambil foto selfie untuk validasi biometrik.\n6. Tunggu notifikasi bahwa registrasi berhasil."}, {"m": "unr", "k": "FAQ", "t": "Apakah saya tetap bisa menggunakan nomor saya setelah registrasi?", "b": "Ya. Selama kartu masih aktif dan memiliki benefit, layanan dapat digunakan setelah registrasi berhasil."}, {"m": "unr", "k": "FAQ", "t": "Apakah saya perlu membeli kartu SIM baru?", "b": "Tidak. Cukup registrasi prabayar melalui registrasi.ioh.co.id menggunakan nomor yang saat ini masih aktif."}, {"m": "unr", "k": "FAQ", "t": "Saya sudah mencoba registrasi tapi gagal, apa yang harus saya lakukan?", "b": "Lakukan probing detail terhadap kendala pelanggan dan pastikan cara registrasi sudah sesuai. Jika masih belum berhasil, eskalasi sesuai ketentuan yang berlaku."}, {"m": "unr", "k": "FAQ", "t": "Sebelumnya saya sudah registrasi. Mengapa tiba-tiba menjadi tidak teregistrasi?", "b": "Bapak/Ibu/Kak [Nama Pelanggan], mohon maaf atas ketidaknyamanannya. Tidak perlu khawatir, agar layanan Tri tetap dapat digunakan seperti biasa, silakan lakukan registrasi kembali melalui registrasi.ioh.co.id dengan menyiapkan NIK/Nomor KTP.\nTerkait notifikasi registrasi ulang yang Bapak/Ibu/Kak terima, hal ini juga akan kami eskalasikan ke tim terkait untuk investigasi lebih lanjut.\n\nCatatan penanganan khusus:\na. Jika pelanggan tidak dapat diedukasi dan butuh penanganan khusus (ancam blow up media/CEO/YLKI/lembaga konsumen lain atau potensi viral), eskalasi ke Tier2 via trouble ticket dan percepatan melalui email/WAG sesuai prosedur.\nb. Jika tidak dapat diselesaikan Tier2, eskalasi ke Tim Special Service mengacu prosedur special case yang berlaku."}, {"m": "jrn", "k": "Perubahan", "t": "Unreg dan Cek Nomor Terdaftar kini memakai biometrik (mulai 28 Sep 2026)", "b": "1. Flow proses: sebelum 28 Sep 2026 tanpa verifikasi biometrik; mulai 28 Sep 2026 memakai verifikasi biometrik.\n2. Pelanggan >17 tahun: sebelumnya dilakukan pelanggan selama NIK sesuai, tanpa biometrik; sekarang verifikasi dengan wajah pelanggan.\n3. Pelanggan <17 tahun: sebelumnya tanpa biometrik; sekarang verifikasi dengan wajah Kepala Keluarga yang terdaftar dalam Kartu Keluarga yang sama.\n4. Tampilan halaman: sebelumnya harus memilih brand IM3 atau Tri lalu diarahkan ke website masing-masing brand; sekarang proses dalam satu halaman yang sama tanpa pindah halaman brand."}, {"m": "jrn", "k": "Detail", "t": "Informasi singkat perubahan journey", "b": "- Per 28 September 2026, journey Pembatalan Registrasi (Unreg) dan Cek Nomor Terdaftar berubah.\n- Kedua proses dilakukan melalui website registrasi.ioh.co.id dan memakai verifikasi biometrik.\n- Pelanggan >17 tahun: wajah pelanggan.\n- Pelanggan <17 tahun: wajah Kepala Keluarga yang terdaftar."}, {"m": "jrn", "k": "Detail", "t": "Tampilan di Siebel: history unreg dan jumlah nomor terdaftar", "b": "Cek history Pembatalan Registrasi di iCare Siebel: menu Notes > Shared Notes > pilih Note Type UNREG_NIK.\n\nCek jumlah nomor terdaftar di iCare Siebel: menu MSISDN Registration > input NIK yang dicek > pilih Filter Brand > Enter. Jumlah nomor terdaftar muncul pada Query Result."}, {"m": "jrn", "k": "Detail", "t": "Flow Unreg pelanggan >17 tahun", "b": "1. Akses registrasi.ioh.co.id, pilih menu Batalkan Registrasi (Unreg), input nomor yang dibatalkan, klik Lanjutkan.\n2. Klik Hapus Nomor.\n3. Ikuti petunjuk.\n4. Posisikan wajah pemilik NIK dalam bingkai oval, diam hingga bingkai terkunci dan foto diambil.\n5. Pastikan pencahayaan baik dan wajah jelas, tekan Kirim Foto.\n6. Tunggu validasi wajah, jangan tutup halaman.\n7. Muncul Memproses pembatalan registrasi, tunggu tanpa menutup halaman.\n8. Muncul pesan Pembatalan registrasi berhasil. Nomor terlepas dari NIK pemilik. Cek notifikasi unreg berhasil via SMS dari 4444."}, {"m": "jrn", "k": "Detail", "t": "Flow Unreg pelanggan <17 tahun", "b": "1. Akses registrasi.ioh.co.id, pilih Batalkan Registrasi (Unreg), input nomor, klik Lanjutkan.\n2. Klik Hapus Nomor.\n3. Masukkan NIK Kepala Keluarga, klik Lanjut.\n4. Pilih cara verifikasi:\n   a. Bagikan Link Kartu Restu: layar Tinggal satu restu dari Kepala Keluarga tampil dengan status Menunggu persetujuan Kepala Keluarga. Atau\n   b. Unduh dan Kirim QR Code: tekan Bagikan atau Unduh kartu. Jika Kepala Keluarga datang, tekan Mulai verifikasi di perangkat ini.\n5. Klik Lanjut.\n6. Konfirmasi data NIK dan nomor yang dihapus, tekan Lanjut, lalu Mulai Pengambilan Selfie.\n7. Posisikan wajah Kepala Keluarga (bukan anak) dalam bingkai oval, diam hingga foto diambil.\n8. Tinjau dan kirim, pastikan pencahayaan baik, tekan Kirim Foto.\n9. Tunggu validasi wajah, jangan tutup halaman.\n10. Muncul Pembatalan registrasi berhasil. Cek notifikasi unreg berhasil via SMS dari 4444."}, {"m": "jrn", "k": "Detail", "t": "Flow Cek Nomor Terdaftar (>17 dan <17 tahun)", "b": ">17 tahun:\n1. Akses registrasi.ioh.co.id, pilih Cek Nomor Terdaftar, input nomor dan NIK terdaftar, pilih Cek Nomor.\n2. Ikuti petunjuk.\n3. Posisikan wajah pemilik NIK dalam bingkai oval, diam hingga foto diambil.\n4. Tinjau dan kirim, pastikan pencahayaan baik, tekan Kirim Foto.\n5. Tunggu validasi wajah, jangan tutup halaman.\n6. Baca hasil pada halaman Hasil Pengecekan.\n\n<17 tahun:\n1. Sama seperti langkah 1 di atas.\n2. Masukkan NIK Kepala Keluarga dalam Kartu Keluarga yang sama, tekan Lanjut.\n3. Ikuti petunjuk.\n4. Posisikan wajah KEPALA KELUARGA (bukan anak) dalam bingkai oval.\n5. Tinjau dan kirim, tekan Kirim Foto.\n6. Tunggu validasi, jangan tutup halaman.\n7. Baca hasil pada halaman Hasil Pengecekan.", "n": "Hasil cek nomor terdaftar di web maksimal menampilkan 3 nomor, meskipun pelanggan memiliki lebih dari 3 nomor terdaftar."}, {"m": "jrn", "k": "Penanganan", "t": "Probing dan validasi data pelanggan", "b": "a. Nama pelanggan\nb. Nomor yang dipakai untuk Unreg / Cek Nomor Terdaftar\nc. Detail kebutuhan / keluhan pelanggan\nd. Notifikasi yang muncul (jika ada)\ne. Masih memiliki akses ke nomor yang akan di-unreg atau tidak (jika dibutuhkan)\nf. Nomor alternatif (jika dibutuhkan eskalasi)\n\nLalu cek aplikasi dan data pendukung sesuai ketentuan."}, {"m": "jrn", "k": "Penanganan", "t": "Kasus 1: Informasi unreg dan cek nomor terdaftar via website", "b": "Informasikan ke pelanggan cara unreg dan cek nomor terdaftar melalui website dengan validasi biometrik sesuai kebutuhan."}, {"m": "jrn", "k": "Penanganan", "t": "Kasus 2: Pelanggan kendala saat Unreg via website", "b": "1. Pastikan cara, nomor, NIK dan pengambilan foto sudah sesuai, sarankan coba unreg kembali.\n2. Jika pelanggan masih bisa unreg mandiri, arahkan ke channel lain:\n   - UMB: dial *4444#, tekan Call, pilih Unreg.\n   - SMS: kirim SMS ke 4444 dengan mengetik UNREG#NIK KTP yang terdaftar#\n3. Jika tidak bisa unreg mandiri (nomor hilang/rusak) atau pelanggan bersikeras dibantu CS:\n   - Validasi data dan pastikan data registrasi sesuai.\n   - Jika sesuai, CS dapat membantu Unreg sesuai privilege yang berlaku.\n   - Jika NIK yang akan di-unreg tidak sesuai, sarankan mutasi kepemilikan sesuai prosedur.\n4. Jika sudah dicoba cara lain masih gagal: create trouble ticket ke L2, cantumkan detail masalah dan solusi yang sudah disampaikan L1, lampirkan bukti (capture error jika ada) dan nomor alternatif yang bisa dihubungi.", "n": "Untuk stabilitas layanan, semua masalah unreg via website tetap dieskalasi lewat trouble ticket, meskipun pelanggan bersedia diarahkan ke channel lain. Di L2: eskalasi ke Enterprise Helpdesk dan PIC terkait (Artho Hasudungan, Artho.Hasudungan@ioh.co.id), close TT dan input note sesuai ketentuan (tidak perlu update ke pelanggan)."}, {"m": "jrn", "k": "Penanganan", "t": "Kasus 3: Pelanggan kendala saat cek nomor terdaftar via website", "b": "1. Pastikan cara, nomor, NIK dan pengambilan foto sudah sesuai, sarankan coba kembali.\n2. Jika masih gagal: create trouble ticket ke L2, cantumkan detail masalah dan solusi yang sudah disampaikan L1, lampirkan bukti (capture error jika ada) dan nomor alternatif yang bisa dihubungi."}, {"m": "jrn", "k": "Penanganan", "t": "Kasus 4: Pelanggan ingin cek seluruh nomor yang terdaftar dengan NIK miliknya", "b": "1. Contact Center: arahkan pelanggan datang ke 3Store terdekat.\n2. 3Store: validasi data, pastikan data sesuai, dan informasikan nomor terdaftar sesuai kebutuhan pelanggan."}, {"m": "jrn", "k": "Penanganan", "t": "Kasus 5: Masalah sistem lain (mis. unreg berhasil tapi Offer ID 4443 tidak muncul / status masih registered, data tidak sesuai)", "b": "1. L1: create trouble ticket ke L2 melalui Service Request, cantumkan detail masalah dan solusi yang sudah disampaikan L1, lampirkan bukti (capture error jika ada) dan nomor alternatif.\n2. L2: eskalasi ke Enterprise Helpdesk dan PIC terkait (Artho Hasudungan, Artho.Hasudungan@ioh.co.id)."}, {"m": "jrn", "k": "Pencatatan", "t": "Pencatatan interaksi Unreg dan Cek NIK", "b": "Activity code:\n- Inquiry: 2105170001 - prepaid reg/unreg info\n- Complaint: 2405180003 - prepaid unregistration issue\n\nL1 Comment:\n- #Unreg : informasi / keluhan terkait pembatalan registrasi (unreg)\n- #Cek_NIK : informasi / keluhan terkait cek NIK terdaftar", "n": "Untuk keluhan Not Registered 4443 memakai kode berbeda (2405180001, hashtag #UNREG_4443). Lihat materi Not Registered 4443."}, {"m": "sph", "k": "Perubahan", "t": "Penambahan channel SP Happy dan produk reaktivasi 3Store (mulai 8 Okt 2026)", "b": "Mulai 8 Okt 2026:\n- SP Happy 5GB (14 hari) dan SP Happy 7GB (28 hari) ditambah channel Digital Distribution (eCommerce, Modern Retail, Perdana Online).\n- Ada produk baru SP Happy 10GB 30D khusus Reaktivasi di 3Store."}, {"m": "sph", "k": "Detail", "t": "SP Happy pada channel Digital Distribution", "b": "SP Happy 7GB 28D, Rp42.000:\n- Kuota Nasional 7GB, 28 hari\n- Ekstra nelpon ke sesama Tri & IM3 5000 menit, 28 hari\n- Ekstra nelpon ke semua operator 50 menit, 28 hari\n- Anti Spam Plus+ / Adobe Express\n- Benefit OTT (Vidio Lite/VIU/WeTV/iQIYI)\n\nSP Happy 5GB 14D, Rp30.000:\n- Kuota Nasional 5GB, 14 hari\n- Ekstra nelpon ke sesama Tri & IM3 1000 menit, 14 hari\n- Ekstra nelpon ke semua operator 10 menit, 14 hari\n- Anti Spam Plus+ / Adobe Express\n- Benefit OTT (Vidio Lite/VIU/WeTV/iQIYI)\n\nChannel: 3Store, DVM, Perdana Online, Modern Channel Aggregator, Modern Channel Direct, Modern Channel (eSIM), 3ID Official Store eCommerce, 3ID Official Store (eSIM) eCommerce, Bank (eSIM)."}, {"m": "sph", "k": "Detail", "t": "Ketentuan SP Happy 7GB 28D dan 5GB 14D", "b": "- Tidak ada perubahan benefit.\n- Tidak ada perubahan mekanisme penggunaan kuota (masih Regional).\n- Tidak ada perubahan tarif dasar, mengikuti tarif yang berlaku saat ini.\n- Tidak berlaku auto-renewal. Jika masa aktif habis, tidak ada perpanjangan otomatis."}, {"m": "sph", "k": "Detail", "t": "SP Happy 10GB 30D khusus Reaktivasi di 3Store", "b": "Harga Rp50.000, channel 3Store, berlaku auto-renewal.\nBenefit:\n- Kuota Nasional 10GB, 30 hari\n- Ekstra nelpon ke sesama Tri & IM3 5000 menit, 28 hari\n- Ekstra nelpon ke semua operator 50 menit, 28 hari\n- Anti Spam Plus+ / Adobe Express\n- Benefit OTT (Vidio Lite/VIU/WeTV/iQIYI)\n\nKetentuan: khusus reaktivasi di 3Store; mekanisme kuota Regional; tarif dasar mengikuti tarif yang berlaku.", "n": "Di RENA ini masa berlaku ekstra nelpon tertulis 28 hari, sedangkan di materi Starterpack Reaktivasi tertulis 30 hari. Mohon konfirmasi ke pembuat materi."}, {"m": "sph", "k": "Detail", "t": "Tanggal launch per channel", "b": "- Trade dan 3Store: sudah live sejak migrasi DMP.\n- Perdana Online: 8 Okt 2026\n- eCommerce: 12 Okt 2026\n- Modern: 23 Okt 2026"}, {"m": "sph", "k": "FAQ", "t": "Apa yang baru dari Tri per 8 Oktober 2026?", "b": "Produk baru SP 7GB 28D dan SP 5GB 14D untuk channel Digital Distribution, serta SP 10GB 30D untuk reaktivasi di channel 3Store."}, {"m": "sph", "k": "FAQ", "t": "Apa bedanya SP 7GB 28D / 5GB 14D dengan SP 10GB 30D 3Store?", "b": "SP 7GB 28D dan SP 5GB 14D adalah SP Regular. SP 10GB 30D adalah SP khusus reaktivasi."}, {"m": "sph", "k": "FAQ", "t": "Apakah berlaku renewal untuk ketiga SP ini?", "b": "SP 7GB 28D dan SP 5GB 14D tidak berlaku renewal. SP 10GB 30D berlaku renewal."}, {"m": "sph", "k": "FAQ", "t": "Apa saja channel yang saat ini menjual SP 7GB 28D dan SP 5GB 14D?", "b": "Channel Digital Distribution (3Store, Perdana Online, eCommerce, Modern Retail dan Trade)."}, {"m": "sph", "k": "FAQ", "t": "Apakah ada detail tanggal launch-nya?", "b": "Trade dan 3Store sudah live sejak migrasi DMP. Perdana Online 8 Okt 2026, eCommerce 12 Okt 2026, Modern 23 Okt 2026."}, {"m": "dar", "k": "Perubahan", "t": "Recovery STV naik dari maksimal 70% menjadi 100% (mulai 9 Okt 2026)", "b": "Sebelum 9 Okt 2026: pelanggan yang masih punya hutang Pulsa Darurat (kondisi peminjaman sebelum implementasi penutupan) dan dalam 30 hari tidak top up pulsa, saat membeli paket recovery dihitung dari kuota (MB) yang dikonversikan ke Rupiah, dengan recovery maksimal 70% sesuai mekanisme Dual Recovery/STV.\nMulai 9 Okt 2026: mekanisme sama, recovery maksimal 100%.\n\nTidak berubah: deduction hutang non STV Recovery (tetap 100% dari nominal transaksi), channel layanan Loan Balance, dan tipe Loan Balance."}, {"m": "dar", "k": "Detail", "t": "Latar belakang, channel, dan tipe Loan Balance", "b": "Mulai 9 Okt 2026 seluruh skema pemotongan hutang kuota darurat diseragamkan menjadi 100% untuk konsistensi penerapan pada semua skema (sebelumnya ada perbedaan persentase, termasuk STV Recovery 70%).\n\nChannel Loan Balance (tidak berubah): USSD *805#, aplikasi bima+, Facebook, Instagram, SMS 805.\nTipe Loan Balance (tidak berubah): Kuota Darurat dan Flexi Darurat.\nSkema deduction dilakukan otomatis berdasarkan nilai transaksi yang memenuhi syarat (eligible)."}, {"m": "dar", "k": "Detail", "t": "Mekanisme pelunasan (recovery)", "b": "a. Pelunasan dilakukan melalui pemotongan 100% dari nilai transaksi pengisian ulang pulsa atau pembelian kuota, dengan memperhatikan sisa pinjaman yang masih outstanding.\nb. Jika nilai transaksi tidak cukup melunasi seluruh sisa pinjaman, pemotongan sebesar nilai transaksi yang tersedia, dan sisa pinjaman dilanjutkan pada transaksi top up atau pembelian kuota berikutnya sampai lunas."}, {"m": "dar", "k": "Detail", "t": "Matrix recovery pinjaman (semua 100%)", "b": "1. Paket Darurat, Top Up Pulsa (IDR to IDR): recovery 100% dari nilai pulsa yang tersedia, sesuai jumlah pinjaman yang harus dibayar.\n2. Paket Darurat, Top Up Paket Data (MB to IDR): kuota yang dibeli dikonversikan ke Rupiah, dapat dipakai recovery hingga 100%.\n3. Flexi Darurat, Top Up Pulsa (IDR to IDR): recovery 100% dari nilai pulsa yang tersedia, sesuai jumlah loan.\n4. Flexi Darurat, Top Up Paket Data (MB to IDR): berasal dari pembelian paket/kuota, dapat dipakai recovery hingga 100%."}, {"m": "dar", "k": "Penanganan", "t": "Kasus: kuota/pulsa berkurang setelah isi paket/pulsa dan menanyakan jumlah konversi kuota yang dipotong", "b": "Probing:\na. Nama Pelanggan\nb. MSISDN\nc. Pastikan pelanggan memiliki pinjaman paket darurat\nd. Pastikan pelanggan mendapat notifikasi SMS deduction kuota karena pinjaman paket darurat\n\nPengecekan di iCare Siebel:\n1. Cek status dan jumlah paket darurat\n2. Cek jumlah kuota yang dideduct\n\nPenanganan:\n1. Hasil sudah sesuai: informasikan bahwa pemotongan kuota dilakukan untuk pembayaran pinjaman kuota darurat.\n2. Hasil tidak sesuai: edukasi pelanggan untuk menunggu karena akan ditindaklanjuti ke tim terkait.\n   - L1: create trouble ticket ke L2\n   - L2: validasi keluhan, eskalasi ke tim terkait memakai format eskalasi sesuai ketentuan, lampirkan bukti notifikasi kuota telah dideduct untuk pembayaran pinjaman kuota darurat."}, {"m": "dar", "k": "Pencatatan", "t": "Pencatatan interaksi Paket Darurat", "b": "Inquiry: 2121070002 - Paket Darurat Balance\nComplaint: 2421020001 - Paket Darurat Issue"}, {"m": "dar", "k": "FAQ", "t": "Berapa persen pemotongan hutang kuota/Flexi Darurat sekarang?", "b": "100% dari nilai transaksi untuk seluruh skema, termasuk STV Recovery (sebelumnya maksimal 70%), mulai 9 Okt 2026."}, {"m": "dar", "k": "FAQ", "t": "Bagaimana jika nilai transaksi tidak cukup melunasi seluruh pinjaman?", "b": "Dipotong sebesar nilai transaksi yang tersedia. Sisa pinjaman dilanjutkan pada top up atau pembelian kuota berikutnya sampai lunas."}, {"m": "vas", "k": "Perubahan", "t": "Penutupan layanan VAS Konten SMS Premium non-aplikasi", "b": "Efektif 30 Sep 2026, Indosat menutup beberapa layanan VAS berupa Konten SMS Premium yang tidak berbasis aplikasi (hanya SMS/URL), sejalan dengan transformasi digital dan fokus pada layanan bisnis digital.\n\nDampak ke pelanggan:\na. Mulai 1 Okt 2026, layanan tersebut tidak lagi dapat diakses.\nb. Mulai 1 Okt 2026, pelanggan tidak lagi dikenakan biaya berlangganan layanan yang ditutup.\nc. VAS berbasis aplikasi seperti Vidio, Viu, Spotify tetap tersedia."}, {"m": "vas", "k": "Detail", "t": "Notifikasi ke pelanggan", "b": "SMS notifikasi sudah dikirim ke pelanggan terdampak dengan sender IM3Penting dan 3Penting.\n\nIsi SMS: “Pelanggan YTH, mulai 1 Okt 2026, Layanan Konten SMS Premium tidak lagi tersedia. Cek layanan yang aktif di nomormu di bima-3.co/useractivepacks, Info:132”"}, {"m": "vas", "k": "Penanganan", "t": "Probing dan pengecekan", "b": "Probing:\na. Nama Pelanggan\nb. MSISDN\nc. Detail informasi yang dibutuhkan / kendala yang dikeluhkan\nd. Waktu kejadian\n\nPengecekan:\na. Periksa Call History, cari transaksi dengan waktu sesuai informasi pelanggan.\nb. Pastikan Traffic Type transaksi adalah VAS.\nc. Periksa PO ID dan pastikan ada nama vendor/partner pada transaksi.\nd. Cek di SDP Tool untuk status layanan VAS di nomor pelanggan (active/deactivate).\ne. Periksa list layanan VAS Konten SMS Premium yang ditutup."}, {"m": "vas", "k": "Penanganan", "t": "Kasus: pelanggan menanyakan informasi penutupan layanan VAS", "b": "Informasikan kepada pelanggan terkait penutupan layanan VAS yang berlaku."}, {"m": "vas", "k": "Penanganan", "t": "Kasus: pelanggan gagal registrasi layanan VAS", "b": "Edukasi pelanggan dengan standard jawaban di bawah."}, {"m": "vas", "k": "Script", "t": "Standard jawaban: gagal registrasi layanan VAS yang sudah ditutup", "b": "Bapak/Ibu/Kak [Nama Pelanggan], mohon maaf atas ketidaknyamanan yang dialami.\nLayanan VAS yang Bapak/Ibu/Kakak coba registrasikan merupakan layanan Konten SMS Premium yang sudah dihentikan efektif 1 Oktober 2026. Oleh karena itu, registrasi layanan tersebut sudah tidak dapat dilakukan.\nSebagai alternatif, Bapak/Ibu/Kakak masih dapat menikmati layanan VAS lainnya yang berbasis aplikasi. Terima kasih atas pengertian dan kepercayaan Bapak/Ibu/Kakak dalam menggunakan layanan Tri."}, {"m": "vas", "k": "Penanganan", "t": "Kasus: pelanggan mengeluhkan pemotongan pulsa/dana dari VAS yang sudah ditutup dan minta refund", "b": "- Tier 1 eskalasi ke Tier 2 untuk penanganan lebih lanjut.\n- Tier 2 eskalasi ke Tim VAS.\n  To: AllDivisiContent&VAS@ioh.co.id\n  CC: liya.aini@ioh.co.id"}, {"m": "vas", "k": "Pencatatan", "t": "Pencatatan interaksi VAS sunset", "b": "Intent: Inquiry/Complaint\nActivity Code:\n- 2405350002 - VAS Registration Issue\n- 2105010001 - Vas Registration info\nHashtag: #VAS_SUNSET"}, {"m": "vas", "k": "FAQ", "t": "Layanan VAS apa yang ditutup dan sejak kapan?", "b": "Layanan konten SMS premium yang tidak berbasis aplikasi, efektif 30 September 2026."}, {"m": "vas", "k": "FAQ", "t": "Bagaimana benefit VAS yang sudah diregistrasi sebelum ditutup? Apakah masih dikenakan biaya?", "b": "Pelanggan tidak dapat mengakses benefit setelah 30 September; sebelumnya masih bisa menikmati benefit. Pada 1 Oktober 2026 pelanggan tidak dikenakan biaya setelah layanan ditutup."}, {"m": "vas", "k": "FAQ", "t": "Bagaimana cara mengetahui pelanggan masih berlangganan layanan konten?", "b": "- Pelanggan IM3: myIM3, https://myim3.co/useractivepacks\n- Pelanggan Tri: bima+, bima-3.co/useractivepacks"}, {"m": "vas", "k": "FAQ", "t": "Pelanggan merasa tidak pernah registrasi VAS, apakah pulsa bisa dikembalikan?", "b": "Bisa, dengan email ke AllDivisiContent&VAS@ioh.co.id."}, {"m": "vas", "k": "FAQ", "t": "Apakah pelanggan masih bisa registrasi VAS dari IOH? Apakah penutupan berlaku untuk semua pelanggan?", "b": "Masih tersedia untuk layanan VAS berbasis aplikasi. Penutupan hanya berlaku bagi pelanggan yang berlangganan layanan yang belum berbasis aplikasi."}, {"m": "vas", "k": "FAQ", "t": "Apakah layanan konten bisa dibuka kembali? Bagaimana jika masih menerima SMS promosi?", "b": "Untuk saat ini Indosat fokus pada layanan berbasis aplikasi. SMS promosi layanan konten tetap ada khusus untuk layanan berbasis aplikasi."}, {"m": "vas", "k": "FAQ", "t": "Apakah aplikasi pengecekan CS tool masih bisa mengecek konten layanan?", "b": "Ya, CS tool tetap dioperasikan untuk mengecek layanan kerja sama dari partner yang masih aktif."}, {"m": "bic", "k": "Perubahan", "t": "Pengecekan B# Number wajib 2 kali (628xxx dan 08xxx)", "b": "Update panduan: Agent wajib melakukan 2 kali pengecekan B# Number di menu BICP MOBO, memakai awalan 628xxx dan 08xxx, lalu membandingkan hasilnya untuk memastikan data valid sebelum disampaikan ke pelanggan."}, {"m": "bic", "k": "Detail", "t": "Cara pengecekan di aplikasi MOBO", "b": "1. Klik menu Reports di aplikasi MOBO.\n2. Klik tanda Search di menu Reports.\n3. Klik folder Sales and Operations, pilih folder Indosat.\n4. Klik menu Transaction Detail Report.\n5. Sistem menampilkan menu BICP, masukkan tanggal transaksi.\n6. Masukkan tanggal berakhir transaksi.\n7. Masukkan B# dengan awalan 628xxx. Setelah data muncul, wajib cek ulang dengan awalan 08xxx pada nomor yang sama.\n8. Sistem menampilkan data transaksi yang dilakukan outlet/modern channel ke B#."}, {"m": "bic", "k": "Penanganan", "t": "Kasus: Outlet/Mitra butuh info hasil transaksi ke B# (berhasil atau tidak)", "b": "Probing:\na. Nama Outlet\nb. Nomor transaksi A# dan B# number\nc. Layanan/transaksi yang dikeluhkan\nd. Tanggal transaksi\ne. Bukti transaksi\n\nPengecekan: cek dengan 628xxx lalu bandingkan dengan 08xxx untuk memastikan data valid.\n\nPenanganan:\na. Jika kedua format menemukan transaksi ke B# yang dikeluhkan: agent L1 beri penanganan sesuai ketentuan berlaku.\nb. Jika kedua format tidak menemukan transaksi: L1 eskalasi ke L2.\n   - L1: create trouble ticket ke L2 via Service Request, cantumkan detail masalah dan solusi yang sudah disampaikan. Lampirkan bukti transaksi Outlet/Mitra, hasil cek format 628xxx dan 08xxx, capture notifikasi error, serta nomor alternatif yang bisa dihubungi.\n   - L2: eskalasi ke PIC terkait: AllSALDOMOBOSupport@ioh.co.id; yusuf.hibaturrahman@ioh.co.id; M.Rasyad@ioh.co.id; mohamad.bawono@ioh.co.id; mihsaanramadhan@h-partners.com"}, {"m": "bic", "k": "Pencatatan", "t": "Pencatatan interaksi B# Number", "b": "Catat interaksi menggunakan activity code sesuai ketentuan yang berlaku.", "n": "RENA tidak menyebut activity code spesifik untuk materi ini."}, {"m": "bic", "k": "FAQ", "t": "Mengapa pengecekan B# Number perlu dila async function commit(){
  if(!draft||!db)return;const ps=$('ps');
  try{
    if(!live){ps.textContent='Menyimpan data awal...';await seed()}
    ps.textContent='Menyimpan...';const id='m'+Date.now().toString(36),o=Date.now();
    await db.doc('materi/'+id).set(Object.assign({},draft.materi,{o}));
    for(let i=0;i<draft.entri.length;i++)await db.doc('entri/'+id+'_'+i).set(Object.assign({m:id,o:o+i+1},draft.entri[i]));
    mf=id;draft=null;$('dlg').close();
  }catch(x){ps.textContent='Gagal menyimpan. Pastikan Anda punya akses Editor.'}
}
async function seed(){
  if(!db)return;const b=document.querySelector('[data-act=seed]');
  try{for(const m of DM){if(b)b.textContent='Menyimpan...';await db.doc('materi/'+m.id).set(m)}
    for(const e of DEF_E){await db.doc('entri/'+e.id).set(e)}}catch(x){alert('Gagal menyimpan data awal.')}
}
const DATA_URL='';/* tempel alamat data.json di GitHub Pages, contoh: https://USERNAME.github.io/REPO/data.json */
const SNAP='2026-10-22';
async function remote(){
  const st=$('sync');const set=(t,c)=>{if(st){st.textContent=t;st.style.color=c||''}};
  const web=/^https?:/.test(location.protocol);
  const u=DATA_URL||(web?'data.json':'');
  if(!u){set('Mode offline: data per '+SNAP+'. Sumber online belum diatur.','var(--warn)');return}
  try{
    const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
    const j=await r.json();if(!j||!Array.isArray(j.materi)||!Array.isArray(j.entri)||!j.materi.length)throw 0;
    M=j.materi;E=j.entri;set('Data online, diperbarui '+(j.updated||'-')+'.','var(--ok)');
  }catch(x){set('Gagal mengambil data online. Menampilkan data offline per '+SNAP+'.','var(--bad)')}
}
const arm={};

    const[a,b]=k.split(':');if(db)db.doc((a==='e'?'entri/':'materi/')+b).delete().catch(()=>alert('Gagal menghapus.'));return}
  if(c=g('[data-save]')){const[a,b]=c.dataset.save.split(':');save(a,b);return}
  if(c=g('[data-act]')){const a=c.dataset.act;if(a==='manage'){manage=!manage;run()}else if(a==='newE')form('e','');else if(a==='newM')form('m','');else if(a==='seed')seed();else if(a==='imp')impForm();else if(a==='go')go();else if(a==='commit')commit();else if(a==='close')$('dlg').close();return}
  if(c=g('[data-m]')){mf=c.dataset.m;run();return}
  if(c=g('[data-open]')){mf=c.dataset.open;run();window.scrollTo({top:0,behavior:'smooth'})}
});

(async()=>{
  try{const u=await window.claude.use('user');if(u)admin=!!(await u.canEdit()||await u.isOwner())}catch(x){}
  try{db=await window.claude.use('db')}catch(x){}
  if(db){let gm=null,ge=null;
    const rd=s=>s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.o||0)-(b.o||0));
    const upd=()=>{if(gm===null||ge===null)return;if(admin&&!seeded&&!gm.length&&!ge.length){seeded=true;seed()}if(gm.length||ge.length){M=gm;E=ge;live=true}else{M=DM.slice();E=DEF_E.slice();live=false}
      if(mf&&!M.find(m=>m.id===mf))mf='';run()};
    try{db.collection('materi').onSnapshot(s=>{gm=rd(s);upd()},()=>{});db.collection('entri').onSnapshot(s=>{ge=rd(s);upd()},()=>{})}catch(x){}
  }
  if(!db)await remote();
  run();
})();
