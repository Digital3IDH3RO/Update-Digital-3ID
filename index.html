<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pusat Update Materi</title>
<style>
:root{--bg:#f4f3fb;--card:#fff;--ink:#1b1f2a;--mut:#667085;--line:#e6e4f2;--acc:#6d28d9;--acc2:#efe9ff;--ok:#12805c;--okbg:#e4f6ee;--warn:#b25e09;--warnbg:#fff1dc;--bad:#c0392b;--badbg:#fde8e6;--sh:0 6px 20px rgba(80,50,160,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111a;--card:#1c1a28;--ink:#ecebf5;--mut:#a09fb8;--line:#2e2b42;--acc:#b79cff;--acc2:#2a2347;--ok:#4cd0a0;--okbg:#14352a;--warn:#f0a850;--warnbg:#3a2a12;--bad:#ff8b7d;--badbg:#3d1d1a;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 60px}
.hero{background:linear-gradient(120deg,#5b21b6,#c026d3 55%,#f97316);color:#fff;border-radius:0 0 26px 26px;padding:26px 20px 70px;margin:0 -16px}
.hero h1{margin:0;font-size:26px}.hero p{margin:4px 0 0;opacity:.92}
.tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stats{display:flex;gap:10px;margin:-48px 0 14px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.stat b{font-size:22px;display:block;color:var(--acc)}.stat span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.small{padding:3px 10px;font-size:12px}
.hero button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:5px 13px;border-radius:99px;background:var(--acc2);color:var(--acc);border:0}
.chip.on{background:var(--acc);color:#fff}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-right:4px;background:var(--acc2);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mc{position:relative;overflow:hidden;text-align:left;padding:0;border-radius:18px;display:block;width:100%;background:var(--card);box-shadow:var(--sh);transition:transform .15s}
.mc:hover{transform:translateY(-3px)}
.mc .top{height:86px;display:flex;align-items:flex-end;padding:12px 16px;font-size:34px;color:#fff}
.mc .bd{padding:14px 16px 16px}
.mt{font-size:17px;font-weight:700;margin:6px 0 4px}
.path{color:var(--mut);font-size:13px}
.grp{font-size:13px;font-weight:800;color:var(--mut);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.07em}
.en{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac,#6d28d9);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.en h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center;justify-content:space-between}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.bub{background:var(--okbg);border-radius:4px 16px 16px 16px;padding:12px 14px;margin-top:6px}
.k-Do{background:var(--okbg)}.k-Dont{background:var(--badbg)}.k-Perubahan{background:var(--warnbg)}
.en.k-Do,.en.k-Dont,.en.k-Perubahan{background:var(--card)}
.en.k-Do{border-left-color:var(--ok)}.en.k-Dont{border-left-color:var(--bad)}.en.k-Perubahan{border-left-color:#f59e0b}
details.en summary{cursor:pointer;font-weight:600;list-style:none}
details.en summary::before{content:"+ ";color:var(--ac)}
details.en[open] summary::before{content:"\2212 "}
details.en pre{margin-top:8px}
.note{background:var(--warnbg);color:var(--warn);padding:9px 12px;border-radius:10px;margin-top:8px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:620px){.row{grid-template-columns:1fr}}
dialog{border:0;border-radius:18px;padding:18px;width:min(560px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 3px}
.res{margin-top:10px;font-weight:700;color:var(--acc)}
.foot{color:var(--mut);font-size:12.5px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
 <div class="hero"><h1>📚 Pusat Update Materi</h1><p>Ketentuan, FAQ, penanganan, dan standard jawaban terbaru dalam satu tempat.</p>
  <div class="tools" id="tools"></div></div>
 <div class="stats" id="stats"></div>
 <div class="card"><input type="search" id="q" placeholder="🔎 Cari: tidak bisa beli paket, masa aktif tidak bertambah, biaya reaktivasi...">
  <div class="chips" id="chips"></div><div class="path" id="stat" style="margin-top:8px"></div></div>
 <div id="out"></div>
 <p class="foot">Ringkasan disusun dari dokumen RENA (INTERNAL). <span id="upd"></span> Jika ada perbedaan, dokumen RENA asli yang berlaku. Pastikan hasil pengecekan di sistem sebelum menjawab pelanggan.</p>
</div>
<dialog id="dlg"><div id="frm"></div></dialog>
<script>
const KM={Perubahan:'🔔',Detail:'📌',FAQ:'❓',Penanganan:'🛠️',Script:'💬',Do:'✅',Dont:'⛔',Pencatatan:'📝'};
const KORD=['Perubahan','Detail','Penanganan','Script','Do','Dont','FAQ','Pencatatan'];
const KLBL={Do:'Do (Yang harus dilakukan)',Dont:'Don\u2019ts (Yang tidak perlu)',Script:'Standard jawaban'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(x=>x.length>1);
let M=[],E=[],DEN=[],mf='',n=0;
const col=m=>m.c||'#6d28d9', ico=m=>m.ic||'📄';
const mOf=id=>M.find(m=>m.id===id)||{s:'?',t:'?',id:''};
function entry(e){
  const i=n++,m=mOf(e.m),c=col(m),head=`<span>${KM[e.k]||'📄'} <span class="badge">${esc(m.s)}</span>${esc(e.t)}</span>`;
  const note=e.n?`<div class="note">${esc(e.n)}</div>`:'';
  if(e.k==='FAQ')return `<details class="en" style="--ac:${c}"><summary>${esc(e.t)}</summary><pre>${esc(e.b)}</pre>${note}</details>`;
  if(e.k==='Script')return `<div class="en" style="--ac:${c}"><h4>${head}<span><button class="small" data-copy="c${i}">Salin</button></span></h4><div class="bub"><pre id="c${i}">${esc(e.b)}</pre></div>${note}</div>`;
  return `<div class="en k-${e.k}" style="--ac:${c}"><h4>${head}</h4><pre>${esc(e.b)}</pre>${note}</div>`;
}
function calc(){
  return `<div class="card"><div class="mt">🧮 Kalkulator masa aktif reload</div><div class="path">Hitung hasil masa aktif sesuai ketentuan (maks. 365 hari).</div>
  <div class="row"><div><label>Sisa masa aktif saat ini (hari)</label><input type="number" id="sisa" min="0" max="365" value="30"></div>
  <div><label>Denom pulsa</label><select id="den">${DEN.map(d=>`<option value="${d[1]}">Rp${d[0].toLocaleString('id-ID')} (validity ${d[1]} hari)</option>`).join('')}</select></div></div><div class="res" id="res"></div></div>`;
}
function doCalc(){const s=Math.max(0,Math.min(365,+$('sisa').value||0)),v=+$('den').value,a=Math.min(v,365-s);
  $('res').textContent=a===0?'Masa aktif tidak bertambah, sudah mencapai batas 365 hari.':`Bertambah ${a} hari, masa aktif menjadi ${s+a} hari.`+(a<v?` (validity ${v} hari dibatasi maksimal 365 hari)`:'')}
function tools(){
  $('stats').innerHTML=[[M.length,'Materi'],[E.length,'Entri'],[E.filter(e=>e.k==='FAQ').length,'FAQ'],[E.filter(e=>e.k==='Script').length,'Standard jawaban']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
  $('chips').innerHTML=[{id:'',s:'Semua'}].concat(M).map(m=>`<button class="chip${m.id===mf?' on':''}" data-m="${esc(m.id)}">${esc(m.s)}</button>`).join('');
}
function run(){
  const q=$('q').value.trim();n=0;tools();let h='';
  if(q){
    const qt=tok(q);
    const res=E.filter(e=>!mf||e.m===mf).map(e=>{const t=tok(e.t+' '+mOf(e.m).t),b=tok(e.b);let sc=0;qt.forEach(x=>{t.forEach(y=>{if(y.includes(x))sc+=3});b.forEach(y=>{if(y.includes(x))sc+=1})});return{e,sc}}).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,12);
    $('stat').textContent=res.length+' hasil ditemukan';
    h+=res.length?res.map(r=>entry(r.e)).join(''):'<div class="card">Tidak ada hasil. Coba kata kunci lain.</div>';
    if(/masa aktif|365|reload/.test(q.toLowerCase()))h+=calc();
  }else if(mf){
    const m=mOf(mf);$('stat').textContent='';
    h+=`<div class="card" style="border-top:6px solid ${col(m)}"><span class="badge">${ico(m)} ${esc(m.d)}</span><div class="mt">${esc(m.t)}</div><div>${esc(m.sum)}</div><div class="path" style="margin-top:6px">Sumber: ${esc(m.src)}</div></div>`;
    KORD.forEach(k=>{const l=E.filter(e=>e.m===mf&&e.k===k);if(l.length)h+=`<div class="grp">${KM[k]} ${KLBL[k]||k}</div>`+l.map(entry).join('')});
    if(mf==='mas')h+=calc();
  }else{
    $('stat').textContent='';
    h+=`<div class="grid">`+M.map(m=>`<div class="card mc" data-open="${esc(m.id)}" style="padding:0"><div class="top" style="background:linear-gradient(135deg,${col(m)},${col(m)}99)">${ico(m)}</div><div class="bd"><span class="badge">${esc(m.d)}</span><div class="mt">${esc(m.t)}</div><div class="path">${esc(m.sum)}</div></div></div>`).join('')+`</div>`;
  }
  $('out').innerHTML=h;
  if($('sisa')){$('sisa').oninput=doCalc;$('den').onchange=doCalc;doCalc()}
}
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let c;
  if(c=g('[data-copy]')){try{navigator.clipboard.writeText($(c.dataset.copy).innerText).then(()=>{c.textContent='Tersalin';setTimeout(()=>c.textContent='Salin',1200)})}catch(x){}return}
  if(c=g('[data-m]')){mf=c.dataset.m;history.replaceState(null,'',mf?'#'+mf:location.pathname);run();return}
  if(c=g('[data-open]')){mf=c.dataset.open;history.replaceState(null,'','#'+mf);run();window.scrollTo({top:0,behavior:'smooth'})}
});
$('q').addEventListener('input',run);
fetch('data.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  M=d.materi;E=d.entri;DEN=d.denom||[];
  const hs=location.hash.slice(1);if(M.find(m=>m.id===hs))mf=hs;
  if(d.updated)$('upd').textContent='Terakhir diperbarui: '+new Date(d.updated).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+'.';
  run();
}).catch(()=>{$('out').innerHTML='<div class="card">Data materi gagal dimuat. Pastikan file <b>data.json</b> berada satu folder dengan index.html dan halaman dibuka lewat GitHub Pages (bukan langsung dari file).</div>'});
</script>
</body>
</html>
